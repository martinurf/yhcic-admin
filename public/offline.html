<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Offline — YHCIC</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbfafc; color: #17131f; font-family: -apple-system, system-ui, sans-serif; padding: 32px; box-sizing: border-box; text-align: center; }
  .mark { display: inline-block; background: linear-gradient(145deg, #5b2489, #3d145d); color: #fff; font-weight: 600; letter-spacing: -0.02em; padding: 10px 16px; margin-bottom: 22px; }
  h1 { font-size: 1.3rem; margin: 0 0 10px; }
  p { color: #6c6480; line-height: 1.5; margin: 0; max-width: 320px; }
</style>
</head>
<body>
  <div>
    <span class="mark">YHCIC</span>
    <h1>You&rsquo;re offline</h1>
    <p>No connection right now — the panel needs one to show current data. Reconnect and try again.</p>
  </div>
</body>
</html>
